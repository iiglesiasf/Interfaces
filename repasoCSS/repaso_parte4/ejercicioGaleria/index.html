<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Flex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <section class="galeria">

            <article class="tarjeta">
                <img src="https://picsum.photos/id/1018/600/400" alt="Paisaje natural">
                <div class="leyenda">
                    <h2>Naturaleza</h2>
                    <p>Descubre paisajes únicos y rutas increíbles.</p>
                    <a href="#">Ver destino</a>
                </div>
            </article>

            <article class="tarjeta">
                <img src="https://picsum.photos/id/1015/600/400" alt="Río entre montañas">
                <div class="leyenda">
                    <h2>Aventura</h2>
                    <p>Disfruta del senderismo y las actividades al aire libre.</p>
                    <a href="#">Ver destino</a>
                </div>
            </article>

            <article class="tarjeta">
                <img src="https://picsum.photos/id/1016/600/400" alt="Paisaje de montaña">
                <div class="leyenda">
                    <h2>Montaña</h2>
                    <p>Explora montes, miradores y rincones especiales.</p>
                    <a href="#">Ver destino</a>
                </div>
            </article>

            <article class="tarjeta">
                <img src="https://picsum.photos/id/1019/600/400" alt="Paisaje costero">
                <div class="leyenda">
                    <h2>Costa</h2>
                    <p>Conoce playas, acantilados y pueblos marineros.</p>
                    <a href="#">Ver destino</a>
                </div>
            </article>
        </section>
    </main>

</body>
</html>
