<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectores de atributos</title>
    <style>
        /*selectorcss[atributo]*/

        a[target]{
            color: red;
        }

        /*selectorcss[atributo="valor"]*/

        a[title="Instagram"]{
            color: green;
        }

        /*SOLO ENTRAN ESTOS 2 EN EL EXAMEN*/

    </style>
</head>
<body>
    <a href="#" title="Google" target="_blank">Google</a>
    <a href="#" title="Instagram" target="_blank">Instagram</a>
</body>
</html>
