<!-- Hacer cabecera y pie de página en el mismo archivo-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Cinema</title>
    <link rel="stylesheet" href="style.css" type="text/css" media="screen">

</head>
<body>

    <header>
        
        <a id="logo" href="index.html"> 
            <img src="images/logo.png" alt="logo">
            <h1 class="nombrePagina"> Absolute Cinema</h1>
        </a>

        <nav id="headerMap">
            <a href="#" class="activo">Inicio</a>
            <a href="#">Películas</a>
            <a href="#">Series</a>
            <a href="#">Social</a>
        </nav>

        <div id="busqueda">
            <form> 
                <img id="iconoBarra" src="icons/searchIcon.svg" alt="Buscar"> 
                <input type="search" name="buscar" placeholder="Buscar títulos, géneros...">
            </form>

            <a id="fotoPerfil" href="#">
                <img src="images/fotoPerfil.png" alt="fotoPerfil">
            </a>
        </div>

    </header>

    <main></main>

    <footer>   
        <div id="footerLogo">
            <img src="images/logo.png" alt="logo">
            <h1 class="nombrePagina"> Absolute Cinema</h1>
        </div> 

        <div id="footerInfo">
            <p id="copyright"> © 2026 Absolute Cinema. Todos los derechos reservados. </p>

            <nav id="footerMap">
                <a href="#">Inicio |</a>
                <a href="#">Películas |</a>
                <a href="#">Series |</a>
                <a href="#">Social</a>
            </nav>
        </div>

    </footer>
    
</body>
</html>
