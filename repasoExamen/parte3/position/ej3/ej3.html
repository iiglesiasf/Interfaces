<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .tarjeta {
            width: 350px;
            height: 200px;
            background-color: lightblue;
            padding: 20px;
            position: relative;
            
        }

        .etiqueta {
            background-color: coral;
            padding: 10px;
            position: absolute;
            top: 10px;
            right: 10px;
        }

    </style>
</head>
<body>
    <div class="tarjeta">
        <h2>Curso de CSS</h2>
        <p>Aprendiendo posicionamiento.</p>
        <span class="etiqueta">NUEVO</span>
    </div>
</body>
</html>
