<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>

    .caja {
        background-color: lightblue;
        border: 2px solid black;
        padding: 15px;
        margin: 5px;
        display: inline-block;
    }

    .elemento {
        background-color: lightcoral;
        border: 2px solid black;
        padding: 15px;
        margin: 5px;
        display: inline;
    }


</style>
<body>

    <h1>Aprendiendo Display</h1>

    <div class="caja caja1">Caja 1</div>
    <div class="caja caja2">Caja 2</div>
    <div class="caja caja3">Caja 3</div>

    <hr>

    <span class="elemento elemento1">Elemento 1</span>
    <span class="elemento elemento2">Elemento 2</span>
    <span class="elemento elemento3">Elemento 3</span>

</body>
</html>
