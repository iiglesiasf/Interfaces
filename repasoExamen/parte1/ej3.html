<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .tarjeta{
            background-color: #f2f2f2;
            width: 350px;
            border: 2px solid grey;
            border-radius: 12px;
            padding: 20px;
        }


        h2{
            color: blue;
            background-color: white;
            border-bottom: 2px solid blue;
        }

        p{
            color: #444;
            background-color: transparent;
            margin-top: 15px;
        }

        a{
            background-color: blue;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
        }

    </style>
</head>
<body>
    <div class="tarjeta">
    <h2>Aprende CSS</h2>
    <p>Domina los estilos de tu página web.</p>
    <a href="#">Leer más</a>
</div>
</body>
</html>
