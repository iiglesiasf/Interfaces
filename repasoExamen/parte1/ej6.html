<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .producto{
        width: 320px;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 20px;
        box-sizing: border-box;
    }

    .etiqueta{
        background-color: red;
        color: white;
        font-weight: bold;
        border-radius: 4px;
    }

    .titulo{
        color: #333;
        font-size: 22px;
        margin-bottom: 10px;
    }

    .precio{
        color: green;
        font-size: 24px;
        font-weight: bold;
    }

    .comprar{
        color: white;
        background-color: blue;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
    }

    .comprar:hover{
        background-color: rgb(0, 0, 152);
    }

    .producto .precio { /* Prevalece esta regla porque se refiere a 2 clases sobre la otra propiedad, que solo tiene 1*/
        color: orange;
    }

    .precio {
        color: green;
    }

</style>
<body>
    <div class="producto">
    <span class="etiqueta">OFERTA</span>
    <h2 class="titulo">Auriculares Bluetooth</h2>
    <p class="precio">59,99 €</p>
    <p class="descripcion">Sonido de alta calidad y batería duradera.</p>
    <button class="comprar">Comprar</button>
</div>
</body>
</html>
