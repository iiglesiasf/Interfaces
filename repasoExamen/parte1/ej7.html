<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    *{
        margin: 10px;
    }

    p{
        color: blue;
    }

    h2{
        color: red;
    }

    .tarjeta{
        background-color: grey;
    }

    span{
        font-size: 20px;
    }

    .tarjeta:nth-child(3){
        color: green;
    }



</style>
<body>
    <div class="tarjeta">
        <h2>Mi página web</h2>
        <p>Primer párrafo</p>
        <p>Segundo párrafo</p>
        <span>Información adicional</span>
    </div>
</body>
</html>
