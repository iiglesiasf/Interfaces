<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        h1{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 36px;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 3px;
            text-shadow: 5px 5px 4px black;
        }

        .subtitulo{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            font-style: italic;
            color: grey;
            word-spacing: 4px;
        }

        h2{
            font-size: 28px;
            font-weight: 600;
            color: rgb(39, 39, 39);
            text-decoration: underline wavy blue;

        }

        .entradilla{
            font-size: 20px;
            font-weight: bold;
            text-indent: 30px;
            line-height: 1.6;
            text-align: justify;
        }

        .destacado{
            font-style: italic;
            font-size: 22px;
            text-align: center;
            color: purple;
            text-decoration:line-through;
        }

        a{
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>
    
    <h1>TechNews</h1>

    <p class="subtitulo">Las últimas noticias de tecnología</p>

    <h2>El futuro de la inteligencia artificial</h2>

    <p class="entradilla">
        La inteligencia artificial está cambiando el mundo.
    </p>

    <p class="destacado">
        La tecnología debe estar al servicio de las personas.
    </p>

    <a href="#">Leer noticia</a>

</body>
</html>
